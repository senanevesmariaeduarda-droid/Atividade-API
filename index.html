<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GAME TRACK</h1>
        <p>Sua biblioteca de jogos</p>
    </header>

    <main>

        <section class="dashboard">
            <div>
                <h2 id="totalJogos">0</h2>
                <p>Jogos cadastrados</p>
            </div>

            <div>
                <h2 id="jogando">0</h2>
                <p>Jogando</p>
            </div>

            <div>
                <h2 id="finalizados">0</h2>
                <p>Finalizados</p>
            </div>
        </section>

        <section class="filtros">
            <input 
                type="text" 
                id="pesquisa" 
                placeholder="Pesquisar jogo..."
            >

            <select id="filtroStatus">
                <option value="Todos">Todos</option>
                <option value="Quero jogar">Quero jogar</option>
                <option value="Jogando">Jogando</option>
                <option value="Finalizado">Finalizado</option>
                <option value="Abandonado">Abandonado</option>
            </select>
        </section>

        <section>
            <h2>Cadastrar jogo</h2>

            <form id="formJogo">

                <input 
                    type="text" 
                    id="titulo" 
                    placeholder="Título"
                >

                <input 
                    type="text" 
                    id="genero" 
                    placeholder="Gênero"
                >

                <input 
                    type="text" 
                    id="plataforma" 
                    placeholder="Plataforma"
                >

                <input 
                    type="number" 
                    id="nota" 
                    placeholder="Nota"
                    min="0"
                    max="10"
                >

                <select id="status">
                    <option value="">Selecione o status</option>
                    <option value="Quero jogar">Quero jogar</option>
                    <option value="Jogando">Jogando</option>
                    <option value="Finalizado">Finalizado</option>
                    <option value="Abandonado">Abandonado</option>
                </select>

                <button type="submit">Cadastrar jogo</button>

            </form>

            <p id="mensagem"></p>
        </section>

        <section>
            <h2>Meus jogos</h2>

            <div id="listaJogos"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
